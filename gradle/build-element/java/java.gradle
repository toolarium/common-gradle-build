apply plugin: 'java'

// Set source/target compatibility via JavaPluginExtension (Gradle 7+) — avoids deprecated JavaPluginConvention
java {
    sourceCompatibility = JavaVersion.toVersion(project.getProperty('sourceCompatibility').toString())
    targetCompatibility = JavaVersion.toVersion(project.getProperty('targetCompatibility').toString())
}


/***************************************************************************************
 * Java cache strategy
 ***************************************************************************************/
configurations.all { name ->
	if (name.toString().indexOf("quarkusDependency")>=0) { // workaround > v2.8.1.Final
		// keep default
	} else {
		resolutionStrategy {
			// fail eagerly on version conflict (includes transitive dependencies)
			// e.g. multiple different versions of the same dependency (group and name are equal)
			//failOnVersionConflict()

			// prefer modules that are part of this build (multi-project or composite build) over external modules
			//preferProjectModules()

			cacheDynamicVersionsFor commonGradleCacheDynamicDuration, 'seconds'
			cacheChangingModulesFor commonGradleCacheChangingModulesDuration, 'seconds'
		}
	}
}


/***************************************************************************************
 * Compile
 ***************************************************************************************/
ext.compileTimestamp = null
tasks.withType(JavaCompile) { compile ->

	compileTimestamp = new Date()
	options.encoding = "${fileEncoding}"
	options.compilerArgs << '-Xlint:unchecked'
	options.compilerArgs << '-parameters'	
    //options.compilerArgs << '-Aenumconfiguration.validate.strict=true'	

	options.deprecation = true
	// sourceCompatibility and targetCompatibility are set via java { } extension above

	// set fork process
	if (project.hasProperty('compileJavaFork')) {
		compile.options.fork = project.getProperty('compileJavaFork')
	}

	// set compiler path — forkOptions.javaHome removed in Gradle 9; use forkOptions.executable instead
	def logCompileJavaHome = ''
	if (project.hasProperty('compileJavaHome') && project.getProperty('compileJavaHome')!=null) {
		def compileJavaHome = project.getProperty('compileJavaHome')
		if (!compileJavaHome.trim().isEmpty()) {
			logCompileJavaHome = compileJavaHome.trim()
			compile.options.fork = true
			def javaBinDir = new File(logCompileJavaHome, 'bin')
			def javacExec = new File(javaBinDir, 'javac')
			if (!javacExec.exists()) { javacExec = new File(javaBinDir, 'javac.exe') }
			compile.options.forkOptions.executable = javacExec.absolutePath
		}
	}

	// print source and target compatibility — use getProperty to avoid JavaPluginConvention access
	def srcCompat = project.getProperty('sourceCompatibility')
	def tgtCompat = project.getProperty('targetCompatibility')
	if (srcCompat!=null && !srcCompat.toString().isEmpty() && tgtCompat!=null && !tgtCompat.toString().isEmpty()) {
		def sourceVersion = parseVersion(srcCompat)
		def targetVersion = parseVersion(tgtCompat)
		if (sourceVersion!=null && targetVersion!=null && !targetVersion.isCompatibleWith(sourceVersion)) {
			logInfo("The target (" + colorize(HIGHLITE_LEVEL, tgtCompat) + colorize(INFO_LEVEL, ") is not compatible with the source (" ) + colorize(HIGHLITE_LEVEL, srcCompat) + colorize(INFO_LEVEL, ") compatibility!"))
		}
	}

	def compileType = 'main'
	if (compile.name.contains('Test')) {
		compileType = 'test'
	}

	logInfo("Java compiler (${compileType}): sourceCompatibility: " + colorize(HIGHLITE_LEVEL, srcCompat) \
			+ colorize(INFO_LEVEL, ", targetCompatibility: ") + colorize(HIGHLITE_LEVEL, tgtCompat) \
			+ colorize(INFO_LEVEL, ", encoding: ") + colorize(HIGHLITE_LEVEL, options.encoding) \
			+ colorize(INFO_LEVEL, ", deprecation: ") + colorize(HIGHLITE_LEVEL, options.deprecation) \
			+ colorize(INFO_LEVEL, ", fork: ") + colorize(HIGHLITE_LEVEL, options.fork) \
			+ colorize(INFO_LEVEL, ", jdk: ") + colorize(HIGHLITE_LEVEL, logCompileJavaHome) \
			+ colorize(INFO_LEVEL, ", args: ") + colorize(HIGHLITE_LEVEL, options.allCompilerArgs))
}


/***************************************************************************************
 * Build jar file
 ***************************************************************************************/
jar { jar ->
    duplicatesStrategy = 'exclude' // work around, currendly don't work "$duplicatesStrategy"
	onlyIf { return project.compileTimestamp != null }

	logInfo("Set project root package name to [" + colorize(HIGHLITE_LEVEL, projectRootPackageName) + colorize(INFO_LEVEL, "]  -> ") + colorize(HIGHLITE_LEVEL, sourceSets.main.allJava.srcDirs))

	// include readme, license and version files
	into 'META-INF', {
		if (project.getProperty('includeReadmeFile')) {
			from "${readmeFile}"
		}

		if (project.getProperty('includeLicenseFile')) {
			from "${licenseFile}"
		}

		if (project.getProperty('includeVersionFile')) {
			from "${versionFile}"
		}

		if (project.getProperty('includeChangelogFile')) {
			from "${changelogFile}"
		}
		
		if (project.getProperty('includeGeneratedMetaInfFiles') && project.hasProperty('commonGradleResourcebundleOutputPath') && !project.getProperty('commonGradleResourcebundleOutputPath').toString().trim().isEmpty()) {
			from ("${commonGradleResourcebundleOutputPath}/META-INF") 
		}
	}

	// define proper manifest
	manifest {
		attributes 	'Specification-Title'   : rootProject.name,
					'Specification-Version' : project.version,
					'Implementation-Title'  : rootProject.name,
					'Implementation-Version': project.version + project.ext.scmVersionNumber,
					'Created-By'		   	: project.ext.buildToolVersionStackMessage,
					'Built-By'			   	: publishingUsername,
					'Build-Timestamp'	   	: BUILD_TIMESTAMP,
					'Build-JDK'			   	: "${System.properties['java.version']} (${System.properties['java.vendor']} ${System.properties['java.vm.version']})",
					'Build-OS'			   	: "${System.properties['os.name']} (${System.properties['os.version']}), ${System.properties['os.arch']}",
					'Source-Compatibility'  : project.getProperty('sourceCompatibility').toString(),
					'Target-Compatibility'  : project.getProperty('targetCompatibility').toString()

		if (project.hasProperty('mainClassName') && !project.getProperty('mainClassName').toString().trim().isEmpty()) {
			attributes 'Main-Class': project.getProperty('mainClassName')
		}
	}

	doFirst {
		if (project.hasProperty('mainClassPath') && !project.getProperty('mainClassPath').toString().trim().isEmpty()) {
			def classPath = project.getProperty('mainClassPath').toString().trim()
			if (classPath == 'auto') {
				classPath = configurations.runtimeClasspath.files.collect { it.getName() }.join(' ')
			} else {
				classPath = classPath.replace(',', ' ').replaceAll('\\s+', ' ').trim()
			}
			manifest.attributes 'Class-Path': classPath
		}
	}

	doLast {
		if (project.hasProperty('showCreatedArtefacts') && project.getProperty('showCreatedArtefacts')) {
			// jar.archiveFileName
			def filename = prepareFilename(jar.archiveFile.get().asFile.path)
			printInfo("> Created package " + colorize(HIGHLITE_LEVEL, filename) + ".")
		}
	}
}


/***************************************************************************************
 * Prepare META-INF data
 ***************************************************************************************/
task createMeateInfFiles() {
	group = 'Build'
	description = 'Prepares additional files for META-INF jar folder.'
	onlyIf { return project.compileTimestamp != null }
	
	doFirst {
		project.file("$commonGradleResourcebundleOutputPath/META-INF").mkdirs()
	}
}
jar.dependsOn(createMeateInfFiles)


/***************************************************************************************
 * Build sources jar file
 ***************************************************************************************/
task sourcesJar(type: Jar, dependsOn: classes) { jar ->
	group = 'Build'
	description = 'Assembles the sources into a jar file'
	onlyIf { return project.compileTimestamp != null }

	def configDirectoryName = project.getProperty("configDirectoryName")
	def configDirectory = project.getProperty("configDirectory")
	def docsDirectoryName = project.getProperty("docsDirectoryName")
	def docsDirectory = project.getProperty("docsDirectory")
	def srcDirectory = project.getProperty("srcDirectory")
	def srcDirectoryName = project.getProperty("srcDirectoryName")

	/*
	def jarSourceIncludePath;
	if (project.hasProperty('jarSourceIncludePath')) {
		jarSourceIncludePath = project.getProperty('jarSourceIncludePath')
	} else {
		jarSourceIncludePath = projectRootPackageName.replace('.', '/')
	}

	from sourceSets.main.allJava, {
		include "${jarSourceIncludePath}/**"
	}
	*/

	into "${configDirectoryName}", {
		from "${configDirectory}"
	}

	if (project.getProperty('includeDocsDirectoryInSource')) {
        into "${docsDirectoryName}", {
            from "${docsDirectory}"
        }
	}

	into 'gradle', {
		from 'gradle'
	}

	into "${srcDirectoryName}", {
		from "${srcDirectory}"
	}

	from '.checkstyle'
	from '.classpath'
	from '.editorconfig'
	from '.java-version'
	from '.project'
	from '.settings'
	from 'build.gradle'
	from 'gradle.properties'
	from 'gradlew'
	from 'gradlew.bat'
	from 'settings.gradle'

	if (project.getProperty('includeLicenseFile')) {
		from "${licenseFile}"
	}

	if (project.getProperty('includeReadmeFile')) {
		from "${readmeFile}"
	}

	if (project.getProperty('includeVersionFile')) {
		from "${versionFile}"
	}

	if (project.getProperty('includeChangelogFile')) {
		from "${changelogFile}"
	}

	logInfo("Set project root package name to [" + colorize(HIGHLITE_LEVEL, projectRootPackageName) + colorize(INFO_LEVEL, "]  -> ") + colorize(HIGHLITE_LEVEL, sourceSets.main.allJava.srcDirs))

	// include readme, license and version files
	into 'META-INF', {
		if (project.getProperty('includeReadmeFile')) {
			from "${readmeFile}"
		}

		if (project.getProperty('includeLicenseFile')) {
			from "${licenseFile}"
		}

		if (project.getProperty('includeVersionFile')) {
			from "${versionFile}"
		}

		if (project.getProperty('includeChangelogFile')) {
			from "${changelogFile}"
		}
	}

	archiveClassifier = 'sources'
	//archiveAppendix = 'sources'

	// define proper manifest
	manifest {
		attributes 	'Specification-Title'   : rootProject.name,
					'Specification-Version' : project.version,
					'Implementation-Title'  : rootProject.name,
					'Implementation-Version': project.version + project.ext.scmVersionNumber,
					'Created-By'		   	: project.ext.buildToolVersionStackMessage,
					'Built-By'			   	: publishingUsername,
					'Build-Timestamp'	   	: BUILD_TIMESTAMP,
					'Build-JDK'			   	: "${System.properties['java.version']} (${System.properties['java.vendor']} ${System.properties['java.vm.version']})",
					'Build-OS'			   	: "${System.properties['os.name']} (${System.properties['os.version']}), ${System.properties['os.arch']}",
					'Source-Compatibility'  : project.getProperty('sourceCompatibility').toString(),
					'Target-Compatibility'  : project.getProperty('targetCompatibility').toString()
	}

	doLast {
		if (project.hasProperty('showCreatedArtefacts') && project.getProperty('showCreatedArtefacts')) {
			// jar.archiveFileName
			def filename = prepareFilename(jar.archiveFile.get().asFile.path)
			printInfo("> Created package " + colorize(HIGHLITE_LEVEL, filename) + ".")
		}
	}
}
