apply from: "${commonGradleBuildElementPath}/base/json.gradle"


/****************************************************************************************
 * Get direct (first-level) dependencies for a given configuration.
 * Defaults to runtimeClasspath which covers implementation + runtimeOnly deps.
 * Use compileClasspath to additionally include compileOnly / annotation-processor deps.
 *
 * Returns a list of maps: [group, artifact, version, file]
 ****************************************************************************************/
ext.getDirectDependencies = { String configName = 'runtimeClasspath' ->
    def config = configurations[configName]
    def fileByGA = [:]
    try {
        config.incoming
            .artifactView { it.lenient = true }
            .artifacts
            .each { artifact ->
                def ci = artifact.id.componentIdentifier
                if (ci instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier) {
                    if (artifact.file != null) {
                        fileByGA["${ci.group}:${ci.module}"] = artifact.file.toString().replace('\\', '/')
                    }
                }
            }
    } catch (Exception e) {
        logInfo("Could not resolve artifact files for ${configName}: " + e.getMessage())
    }

    // root.dependencies gives only the direct (first-level) declared dependencies.
    config.incoming.resolutionResult.root.dependencies
        .findAll { it instanceof org.gradle.api.artifacts.result.ResolvedDependencyResult }
        .collect { dep ->
            def mid = dep.selected.moduleVersion
            if (mid == null) {
                return null
            }
            [
                group   : mid.group,
                artifact: mid.name,
                version : mid.version,
                file    : fileByGA["${mid.group}:${mid.name}"]
            ]
        }
        .findAll { it != null && it.group != null }
}


/****************************************************************************************
 * Get direct runtime dependencies (implementation + runtimeOnly).
 ****************************************************************************************/
ext.getRuntimeDependencies = {
    getDirectDependencies('runtimeClasspath')
}


/****************************************************************************************
 * Get direct compile-time-only dependencies (compileOnly + annotationProcessor) —
 * i.e. deps on the compileClasspath that are NOT on the runtimeClasspath.
 ****************************************************************************************/
ext.getCompileTimeDependencies = {
    def runtimeCoords = getDirectDependencies('runtimeClasspath')
        .collect { "${it.group}:${it.artifact}" }.toSet()
    getDirectDependencies('compileClasspath')
        .findAll { !runtimeCoords.contains("${it.group}:${it.artifact}") }
}


/****************************************************************************************
 * Export request dependency
 ****************************************************************************************/
task exportRequestDepndency {
    doLast { 
        def jsonOutput = "["
        
        configurations.compileClasspath.incoming.getResolutionResult().getAllDependencies().each { depResult  ->
        jsonOutput += "\n{\"compileClasspath\": ["
            jsonOutput += "{\"from\":\"" + depResult.getFrom() + "\"," + "\"requested\":\"" + depResult.getRequested() + "\"},"
        }
        if (jsonOutput[-1] == ',') {
            jsonOutput = jsonOutput[0..-2]
        }        
        jsonOutput += "]}"
        
        jsonOutput += ",\n{\"runtimeClasspath\": ["
        configurations.runtimeClasspath.incoming.getResolutionResult().getAllDependencies().each { depResult  ->
            jsonOutput += "{\"from\":\"" + depResult.getFrom() + "\"," + "\"requested\":\"" + depResult.getRequested() + "\"},"
        }
        if (jsonOutput[-1] == ',') {
            jsonOutput = jsonOutput[0..-2]
        }
        jsonOutput += "]}"
        
        jsonOutput += ",\n{\"testCompileClasspath\": ["
        configurations.testCompileClasspath.incoming.getResolutionResult().getAllDependencies().each { depResult  ->
            jsonOutput += "{\"from\":\"" + depResult.getFrom() + "\"," + "\"requested\":\"" + depResult.getRequested() + "\"},"
        }
        if (jsonOutput[-1] == ',') {
            jsonOutput = jsonOutput[0..-2]
        }
        jsonOutput += "]}"
        
        jsonOutput += ",\n{\"testRuntimeClasspath\": ["
        configurations.testRuntimeClasspath.incoming.getResolutionResult().getAllDependencies().each { depResult  ->
            jsonOutput += "{\"from\":\"" + depResult.getFrom() + "\"," + "\"requested\":\"" + depResult.getRequested() + "\"},"
        }
        if (jsonOutput[-1] == ',') {
            jsonOutput = jsonOutput[0..-2]
        }        
        jsonOutput += "]}"
        
        jsonOutput += "\n]"
        println jsonOutput
    }
}


/****************************************************************************************
 * Export dependency tree as json
 ****************************************************************************************/
task exportDependency {
    doLast {
        def gradleMajor = Integer.valueOf(gradle.gradleVersion.toString().split('\\.')[0])

        // Gradle 8+: resolvedConfiguration/ResolvedDependency deprecated (8) / removed (9);
        // use ResolutionResult tree instead.
        def exportComponentResultTree
        exportComponentResultTree = { component, fileByGA, visited ->
            def mid = component.moduleVersion
            if (mid == null || !visited.add("${mid.group}:${mid.name}:${mid.version}")) return ""
            def file = fileByGA["${mid.group}:${mid.name}"]
            if (file == null) {
                file = ""
            }
            def result = "\n{\"groupId\":\"${mid.group}\",\"artifactId\":\"${mid.name}\",\"version\":\"${mid.version}\",\"file\":\"${file}\""
            result += ",\"dependencies\":["
            def children = component.dependencies
                .findAll { it instanceof org.gradle.api.artifacts.result.ResolvedDependencyResult }
                .collect { exportComponentResultTree(it.selected, fileByGA, visited) }
                .findAll { it }
            if (children) result += children.join(',')
            result += "]},"
            return result
        }

        def exportConfigDeps = { configName, isRuntime ->
            def out = ""
            def config = configurations[configName]
            if (gradleMajor < 8) {
                config.resolvedConfiguration.firstLevelModuleDependencies.each { dep ->
                    def depJson = ""
                    def addToJson
                    addToJson = { resolvedDep ->
                        depJson += "\n{"
                        depJson += "\"groupId\":\"${resolvedDep.module.id.group}\",\"artifactId\":\"${resolvedDep.module.id.name}\",\"version\":\"${resolvedDep.module.id.version}\",\"file\":\"${resolvedDep.getModuleArtifacts()[0].file.toString().replace('\\', '/')}\""
                        depJson += ",\"dependencies\":["
                        if (resolvedDep.children.size() != 0) {
                            resolvedDep.children.each { childResolvedDep ->
                                if (resolvedDep in childResolvedDep.getParents()) {
                                    addToJson(childResolvedDep)
                                }
                            }
                            if (depJson[-1] == ',') {
                                depJson = depJson[0..-2]
                            }
                        }
                        depJson += "]},"
                    }
                    addToJson(dep)
                    out += depJson
                }
            } else {
                def fileByGA = [:]
                try {
                    config.incoming.artifactView { it.lenient = true }.artifacts.each { a ->
                        def ci = a.id.componentIdentifier
                        if (ci instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier) {
                            if (a.file != null) {
                                fileByGA["${ci.group}:${ci.module}"] = a.file.toString().replace('\\', '/')
                            }
                        }
                    }
                } catch (Exception e) {
                    logInfo("Could not resolve artifact files for ${configName}: " + e.getMessage())
                }
                config.incoming.resolutionResult.root.dependencies
                    .findAll { it instanceof org.gradle.api.artifacts.result.ResolvedDependencyResult }
                    .each { dep -> out += exportComponentResultTree(dep.selected, fileByGA, new HashSet()) }
            }
            return out
        }

        def jsonOutput = "["

        jsonOutput += "\n{\"compileClasspath\": ["
        jsonOutput += exportConfigDeps('compileClasspath', false)
        if (jsonOutput[-1] == ',') jsonOutput = jsonOutput[0..-2]
        jsonOutput += "]}"

        jsonOutput += ",\n{\"runtimeClasspath\": ["
        jsonOutput += exportConfigDeps('runtimeClasspath', true)
        if (jsonOutput[-1] == ',') jsonOutput = jsonOutput[0..-2]
        jsonOutput += "]}"

        jsonOutput += ",\n{\"testCompileClasspath\": ["
        jsonOutput += exportConfigDeps('testCompileClasspath', false)
        if (jsonOutput[-1] == ',') jsonOutput = jsonOutput[0..-2]
        jsonOutput += "]}"

        jsonOutput += ",\n{\"testRuntimeClasspath\": ["
        jsonOutput += exportConfigDeps('testRuntimeClasspath', true)
        if (jsonOutput[-1] == ',') jsonOutput = jsonOutput[0..-2]
        jsonOutput += "]}"

        jsonOutput += "\n]"
        println jsonOutput
    }
}
