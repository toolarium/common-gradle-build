/**
 * Search and replace by properties
 */
ext.searchReplaceByProperties = { inputLine, replacePlaceHolders = true ->
	def line = inputLine
	if (!replacePlaceHolders) return line

	// --- 1. Always-applied replacements (properties always present) ---
	[	'@@PROJECT_NAME@@'               : "${rootProject.name}",
		'@@PROJECT_TYPE@@'               : "${project.ext.projectType}",
		'@@GROUP_ID@@'                   : "${project.ext.projectGroupId}",
		'@@COMPONENT_ID@@'               : "${project.ext.projectComponentId}",
		'@@PACKAGE@@'                    : "${project.ext.projectRootPackageName}",
		'@@DESCRIPTION@@'                : "${project.ext.projectDescription}",
		'@@URL@@'                        : "${project.ext.projectUrl}",
		'@@LICENSE@@'                    : "${project.ext.licenseText}",
		'@@LICENSE_ORGANISATION@@'       : "${project.ext.licenseOrganisation}",
		'@@MAJOR_NUMBER@@'               : "${project.ext.majorVersionNumber}",
		'@@MINOR_NUMBER@@'               : "${project.ext.minorVersionNumber}",
		'@@REVISION_NUMBER@@'            : "${project.ext.revisionVersionNumber}",
		'@@MICRO_NUMBER@@'               : "${project.ext.revisionVersionNumber}",
		'@@QUALIFIER@@'                  : "${project.ext.qualifierVersionNumber}",
		'@@SCM_NUMBER@@'                 : "${project.ext.scmVersionNumber}",
		'@@BUILD_TIMESTAMP@@'            : "${project.ext.BUILD_TIMESTAMP}",
		'@@BUILD_TIMESTAMP_SHORT@@'      : "${project.ext.BUILD_TIMESTAMP_SHORT}",
		'@@DATE@@'                       : "${DATE}",
		'@@YEAR@@'                       : "${YEAR}",
		'@@IS_RELEASE_VERSION@@'         : "${project.ext.isReleaseVersion}",
		'@@VERSION@@'                    : "${project.version}",
		'@@LINE@@'                       : "${LINE}",
		'@@STAR_LINE@@'                  : "${STAR_LINE}",
		'@@COMMON_GRADLE_BUILD_URL@@'    : "${defaultCommonGradleBuildUrl}",
		'@@BUILD_TOOL_VERSION_MESSAGE@@' : "${project.ext.buildToolVersionStackMessage}",
		'@@sourceCompatibility@@'        : "${project.getProperty('sourceCompatibility')}",
		'@@targetCompatibility@@'        : "${project.getProperty('targetCompatibility')}",
	].each { token, value -> line = line.replace(token, value.toString()) }

	// --- 2. Conditional replacements: [token, propertyName] ---
	[	// project
		['@@PARENT_PACKAGE@@',                                   'projectParentPackageName'],
		// source directories
		['@@MAIN@@',                                             'srcMainDirectoryName'],
		['@@SRC_MAIN@@',                                         'srcMainDirectory'],
		['@@TEST@@',                                             'srcTestDirectoryName'],
		['@@SRC_TEST@@',                                         'srcTestDirectory'],
		['@@SRC_GEN_MAIN@@',                                     'generatedCommonGradleBuildJavaSources'],
		['@@SRC_GEN_RESOURCES@@',                                'generatedCommonGradleBuildResourcesSources'],
		// checkstyle
