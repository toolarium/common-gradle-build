		['@@KUBERNETES_IDM_READINESS_SUCCESS_THRESHOLD@@',       'kubernetesIdmReadinessSuccessThreshold'],
		['@@KUBERNETES_IDM_READINESS_TIMEOUT_SECONDS@@',         'kubernetesIdmReadinessTimeoutSeconds'],
		['@@KUBERNETES_IDM_LIVENESS_CHECK_PATH@@',               'kubernetesIdmLivenessCheckPath'],
		['@@KUBERNETES_IDM_LIVENESS_FAILURE_THRESHOLD@@',        'kubernetesIdmLivenessFailureThreshold'],
		['@@KUBERNETES_IDM_LIVENESS_SCHEME@@',                   'kubernetesIdmLivenessScheme'],
		['@@KUBERNETES_IDM_LIVENESS_INITIAL_DELAY_SECONDS@@',    'kubernetesIdmLivenessInitialDelaySeconds'],
		['@@KUBERNETES_IDM_LIVENESS_PERIOD_SECONDS@@',           'kubernetesIdmLivenessPeriodSeconds'],
		['@@KUBERNETES_IDM_LIVENESS_SUCCESS_THRESHOLD@@',        'kubernetesIdmLivenessSuccessThreshold'],
		['@@KUBERNETES_IDM_LIVENESS_TIMEOUT_SECONDS@@',          'kubernetesIdmLivenessTimeoutSeconds'],
		['@@KUBERNETES_IDM_STARTUP_CHECK_PATH@@',                'kubernetesIdmStartupCheckPath'],
		['@@KUBERNETES_IDM_STARTUP_FAILURE_THRESHOLD@@',         'kubernetesIdmStartupFailureThreshold'],
		['@@KUBERNETES_IDM_STARTUP_SCHEME@@',                    'kubernetesIdmStartupScheme'],
		['@@KUBERNETES_IDM_STARTUP_INITIAL_DELAY_SECONDS@@',     'kubernetesIdmStartupInitialDelaySeconds'],
		['@@KUBERNETES_IDM_STARTUP_PERIOD_SECONDS@@',            'kubernetesIdmStartupPeriodSeconds'],
		['@@KUBERNETES_IDM_STARTUP_SUCCESS_THRESHOLD@@',         'kubernetesIdmStartupSuccessThreshold'],
		['@@KUBERNETES_IDM_STARTUP_TIMEOUT_SECONDS@@',           'kubernetesIdmStartupTimeoutSeconds'],
		// kubernetes readiness / liveness - generic
		['@@KUBERNETES_READINESS_FAILURE_THRESHOLD@@',           'kubernetesReadinessFailureThreshold'],
		['@@KUBERNETES_READINESS_SCHEME@@',                      'kubernetesReadinessScheme'],
		['@@KUBERNETES_READINESS_INITIAL_DELAY_SECONDS@@',       'kubernetesReadinessInitialDelaySeconds'],
		['@@KUBERNETES_READINESS_PERIOD_SECONDS@@',              'kubernetesReadinessPeriodSeconds'],
		['@@KUBERNETES_READINESS_SUCCESS_THRESHOLD@@',           'kubernetesReadinessSuccessThreshold'],
		['@@KUBERNETES_READINESS_TIMEOUT_SECONDS@@',             'kubernetesReadinessTimeoutSeconds'],
		['@@KUBERNETES_LIVENESS_FAILURE_THRESHOLD@@',            'kubernetesLivenessFailureThreshold'],
		['@@KUBERNETES_LIVENESS_SCHEME@@',                       'kubernetesLivenessScheme'],
		['@@KUBERNETES_LIVENESS_INITIAL_DELAY_SECONDS@@',        'kubernetesLivenessInitialDelaySeconds'],
		['@@KUBERNETES_LIVENESS_PERIOD_SECONDS@@',               'kubernetesLivenessPeriodSeconds'],
		['@@KUBERNETES_LIVENESS_SUCCESS_THRESHOLD@@',            'kubernetesLivenessSuccessThreshold'],
		['@@KUBERNETES_LIVENESS_TIMEOUT_SECONDS@@',              'kubernetesLivenessTimeoutSeconds'],
		['@@KUBERNETES_STARTUP_FAILURE_THRESHOLD@@',             'kubernetesStartupFailureThreshold'],
		['@@KUBERNETES_STARTUP_SCHEME@@',                        'kubernetesStartupScheme'],
		['@@KUBERNETES_STARTUP_INITIAL_DELAY_SECONDS@@',         'kubernetesStartupInitialDelaySeconds'],
		['@@KUBERNETES_STARTUP_PERIOD_SECONDS@@',                'kubernetesStartupPeriodSeconds'],
		['@@KUBERNETES_STARTUP_SUCCESS_THRESHOLD@@',             'kubernetesStartupSuccessThreshold'],
		['@@KUBERNETES_STARTUP_TIMEOUT_SECONDS@@',               'kubernetesStartupTimeoutSeconds'],
		['@@KUBERNETES_TERMINATION_GRACEPERIOD_SECONDS@@',       'kubernetesTerminationGraceperiodSeconds'],
		// elastic
		['@@ES_ELASTICSEARCH_VERSION@@',                         'esElasticsearchVersion'],
		['@@ES_ELASTICSEARCH_CLUSTER_NAME@@',                    'esElasticsearchClusterName'],
		['@@ES_ELASTICSEARCH_REPLICAS@@',                        'esElasticsearchReplicas'],
		['@@ES_ELASTICSEARCH_STORAGE_SIZE@@',                    'esElasticsearchStorageSize'],
		['@@ES_ELASTICSEARCH_STORAGE_CLASS_NAME@@',              'esElasticsearchStorageClassName'],
		// dist path
		['@@DISTNAME@@',                                         'commonGradleBuildDistName'],
		// jwebserver
		['@@resolveParentResourceIfNotFound@@',                  'resolveParentResourceIfNotFound'],
	].each { token, prop ->
		if (project.hasProperty(prop))
			line = line.replace(token, project.getProperty(prop).toString())
	}

	// --- 3. Special transforms ---

	// whitespace-stripped
	if (project.hasProperty('dockerJlinkModules'))
		line = line.replace('@@dockerJlinkModules@@', "${project.ext.dockerJlinkModules}".toString().replaceAll('[\\s\\t]+', ''))

	// base64-encoded kubernetes database credentials
	if (project.hasProperty('kubernetesDatabaseUsername'))
		line = line.replace('@@KUBERNETES_DATABASE_USERNAME@@', encodeBase64("${project.ext.kubernetesDatabaseUsername}", "${project.ext.kubernetesUsernamePasswordBase64Encode}").toString())
	if (project.hasProperty('kubernetesDatabasePassword'))
		line = line.replace('@@KUBERNETES_DATABASE_PASSWORD@@', encodeBase64("${project.ext.kubernetesDatabasePassword}", "${project.ext.kubernetesUsernamePasswordBase64Encode}").toString())
	if (project.hasProperty('kubernetesDatabaseAdminUsername'))
		line = line.replace('@@KUBERNETES_DATABASE_ADMIN_USERNAME@@', encodeBase64("${project.ext.kubernetesDatabaseAdminUsername}", "${project.ext.kubernetesUsernamePasswordBase64Encode}").toString())
	if (project.hasProperty('kubernetesDatabaseAdminPassword'))
		line = line.replace('@@KUBERNETES_DATABASE_ADMIN_PASSWORD@@', encodeBase64("${project.ext.kubernetesDatabaseAdminPassword}", "${project.ext.kubernetesUsernamePasswordBase64Encode}").toString())

	// base64-encoded IDM credentials
	if (project.hasProperty('kubernetesIdmDatabaseUsername'))
		line = line.replace('@@KUBERNETES_IDM_DATABASE_USERNAME@@', encodeBase64("${project.ext.kubernetesIdmDatabaseUsername}", "${project.ext.kubernetesUsernamePasswordBase64Encode}").toString())
	if (project.hasProperty('kubernetesIdmDatabasePassword'))
		line = line.replace('@@KUBERNETES_IDM_DATABASE_PASSWORD@@', encodeBase64("${project.ext.kubernetesIdmDatabasePassword}", "${project.ext.kubernetesUsernamePasswordBase64Encode}").toString())
	if (project.hasProperty('kubernetesIdmAdminUsername'))
		line = line.replace('@@KUBERNETES_IDM_ADMIN_USERNAME@@', encodeBase64("${project.ext.kubernetesIdmAdminUsername}", "${project.ext.kubernetesUsernamePasswordBase64Encode}").toString())
	if (project.hasProperty('kubernetesIdmAdminPassword'))
		line = line.replace('@@KUBERNETES_IDM_ADMIN_PASSWORD@@', encodeBase64("${project.ext.kubernetesIdmAdminPassword}", "${project.ext.kubernetesUsernamePasswordBase64Encode}").toString())

	// --- 4. Computed values ---

	// checkstyle: use configured name, fall back to project name
	def checkstyleConfigName = project.hasProperty('checkstyleConfigurationName')
		? project.getProperty('checkstyleConfigurationName') : "${rootProject.name}"
	line = line.replace('@@CHECKSTYLE_CONFIGURATION_NAME@@', checkstyleConfigName.toString())

	// checkstyle tool version: use override if set, else default
	line = line.replace('@@checkstyleToolVersion@@', project.hasProperty('checkstyleToolVersion')
		? "${project.ext.checkstyleToolVersion}".toString()
		: "${project.ext.checkstyleToolDefaultVersion}".toString())

	// gateway name: use configured name, fall back to "<projectName>-gateway"
	def gatewayName = project.hasProperty('kubernetesGatewayName')
		? "${project.ext.kubernetesGatewayName}" : "${rootProject.name}-gateway"
	line = line.replace('@@KUBERNETES_GATEWAY_NAME@@', gatewayName.toString())

	// application name: composed from package + class name
	if (project.hasProperty('className'))
		line = line.replace('@@applicationName@@', "${project.ext.projectRootPackageName}.${project.ext.className}".toString())

	return line
}
